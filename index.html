<!DOCTYPE html>
<!--
  Lightning Out — Unified Test Page (LO 1.0 Aura & LO 2.0 LWC)
  ==============================================================
  Push this file to your GitHub Pages repo (e.g. feggydinho.github.io).

  ONE setup step required in Salesforce before this works:
    Setup → CORS → New → add https://feggydinho.github.io

  LO 2.0: paste your access token and click Load — domain and App ID are pre-filled.
  LO 1.0: paste your access token (domain and Aura app are pre-filled).
-->
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Lightning Out Test 4-1</title>
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #f1f5f9; }

    /* ── Top bar ── */
    .bar {
        display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
        padding: 10px 16px; background: #1e293b; border-bottom: 2px solid #6366f1;
    }
    .bar-title { font-weight: 700; font-size: 14px; white-space: nowrap; }

    /* ── Version toggle ── */
    .vtoggle {
        display: flex; border: 1px solid #475569; border-radius: 6px; overflow: hidden;
    }
    .vtoggle button {
        padding: 4px 14px; font-size: 12px; font-weight: 600;
        background: transparent; color: #94a3b8; border: none; cursor: pointer;
        transition: background .15s, color .15s;
    }
    .vtoggle button.active { background: #6366f1; color: #fff; }
    .vtoggle button:not(.active):hover { background: #334155; color: #f1f5f9; }

    /* ── Fields ── */
    .field { display: flex; flex-direction: column; gap: 2px; }
    .field label { color: #94a3b8; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .5px; }
    .field input, .field textarea {
        border: 1px solid #475569; border-radius: 4px; padding: 5px 8px;
        font-size: 13px; background: #334155; color: #f1f5f9; outline: none;
    }
    .field input { min-width: 180px; }
    .field textarea { min-width: 280px; height: 54px; resize: vertical; font-family: monospace; font-size: 12px; }
    .field input:focus, .field textarea:focus { border-color: #6366f1; }

    /* de-emphasise the pre-filled fields in LO 2.0 mode */
    .field.dim label { color: #475569; }
    .field.dim input { background: #1e293b; color: #64748b; font-size: 12px; }

    .load-btn {
        padding: 7px 18px; background: #6366f1; color: white; border: none;
        border-radius: 4px; cursor: pointer; font-size: 13px; font-weight: 600;
        align-self: flex-end;
    }
    .load-btn:hover { background: #4f46e5; }
    .load-btn:disabled { opacity: .5; cursor: not-allowed; }

    #lo-status { font-size: 12px; align-self: flex-end; padding-bottom: 2px; margin-left: auto; }
    #lo-status.ok      { color: #4ade80; }
    #lo-status.err     { color: #f87171; }
    #lo-status.loading { color: #facc15; }

    #lo-container { height: calc(100vh - 62px); position: relative; overflow: hidden; }

    /* hide LO 1.0 / LO 2.0 field groups based on mode */
    .v1-only, .v2-only { display: contents; }
    body.mode-v2 .v1-only { display: none; }
    body.mode-v1 .v2-only { display: none; }
</style>
</head>
<body class="mode-v2">

<div class="bar">
    <span class="bar-title">Lightning Out Test 4-1</span>

    <!-- Version toggle -->
    <div class="vtoggle">
        <button id="btn-v2" class="active" onclick="setMode('v2')">LO 2.0 (LWC)</button>
        <button id="btn-v1" onclick="setMode('v1')">LO 1.0 (Aura)</button>
    </div>

    <!-- Shared: domain (always shown, but de-emphasised in v2) -->
    <div class="field dim" id="field-domain">
        <label>My Salesforce Domain</label>
        <input id="lo-domain" type="text"
               value="https://marriottintl--novrelmock.sandbox.my.salesforce.com"
               style="min-width:340px"/>
    </div>

    <!-- LO 2.0 only: App ID (pre-filled, de-emphasised) -->
    <div class="field dim v2-only">
        <label>LO 2.0 App ID</label>
        <input id="lo2-appid" type="text" value="1UsFZ00000000jB0AQ" style="min-width:190px"/>
    </div>

    <!-- LO 2.0 only: Component name (kebab-case custom element) -->
    <div class="field v2-only">
        <label>Component</label>
        <input id="lo2-component" type="text" value="c-lo-test-shell" style="min-width:190px"
               placeholder="c-lo-test-shell"/>
    </div>

    <!-- LO 1.0 only: Aura app name (pre-filled, de-emphasised) -->
    <div class="field dim v1-only">
        <label>Aura App</label>
        <input id="lo1-auraapp" type="text" value="c:madsChatLightningOut" style="min-width:190px"/>
    </div>

    <!-- Shared: access token — the main thing to paste -->
    <div class="field">
        <label>Access Token</label>
        <textarea id="lo-token" placeholder="00DFZ000000uPer!AQ…"></textarea>
    </div>

    <button class="load-btn" id="lo-load-btn" onclick="loadLO()">Load</button>
    <span id="lo-status">—</span>
</div>

<div id="lo-container"></div>

<script>
    var _lo2ScriptInjected = false;
    var _lo1ScriptInjected = false;

    // ── Mode toggle ────────────────────────────────────────────────────────────
    function setMode(v) {
        document.body.className = 'mode-' + v;
        document.getElementById('btn-v1').classList.toggle('active', v === 'v1');
        document.getElementById('btn-v2').classList.toggle('active', v === 'v2');
        // de-emphasise domain for v2, normal for v1
        document.getElementById('field-domain').classList.toggle('dim', v === 'v2');
        setStatus('—', '');
        document.getElementById('lo-container').innerHTML = '';
        document.getElementById('lo-load-btn').disabled = false;
    }

    function currentMode() {
        return document.getElementById('btn-v2').classList.contains('active') ? 'v2' : 'v1';
    }

    // ── Status helper ──────────────────────────────────────────────────────────
    function setStatus(msg, cls) {
        var el = document.getElementById('lo-status');
        el.textContent = msg;
        el.className = cls || '';
    }

    // ── Entry point ────────────────────────────────────────────────────────────
    function loadLO() {
        if (currentMode() === 'v2') {
            loadLO2();
        } else {
            loadLO1();
        }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // LO 2.0 — LWC, iframe-based, uses singleaccess → frontdoor URL
    // ══════════════════════════════════════════════════════════════════════════
    async function loadLO2() {
        var domain    = document.getElementById('lo-domain').value.trim().replace(/\/$/, '');
        var appId     = document.getElementById('lo2-appid').value.trim();
        var component = (document.getElementById('lo2-component').value.trim() || 'c-mads-chat-drawer').toLowerCase();
        var token     = document.getElementById('lo-token').value.trim();

        if (!domain || !appId || !token) {
            setStatus('Fill in all fields', 'err');
            return;
        }

        document.getElementById('lo-load-btn').disabled = true;
        setStatus('Getting frontdoor URL…', 'loading');

        try {
            // Exchange access token → one-time frontdoor URL (60 s TTL).
            // Requires Salesforce Setup → CORS to include this page's origin.
            var fdRes = await fetch(domain + '/services/oauth2/lightningoutsingleaccess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({ access_token: token }).toString()
            });

            if (!fdRes.ok) {
                var errText = await fdRes.text();
                throw new Error('singleaccess ' + fdRes.status + ': ' + errText.slice(0, 200));
            }

            var fdData = await fdRes.json();
            var frontdoorUrl = fdData.frontdoor_url;
            if (!frontdoorUrl) throw new Error('No frontdoor_url in response: ' + JSON.stringify(fdData));
            console.log('[LO2] Frontdoor URL obtained', frontdoorUrl.slice(0, 80) + '…');

            // Inject LO 2.0 bootstrap script once per page load.
            if (!_lo2ScriptInjected) {
                _lo2ScriptInjected = true;
                var s = document.createElement('script');
                s.src = domain + '/lightning/lightning.out.latest/index.iife.prod.js';
                s.type = 'text/javascript';
                s.async = true;
                document.head.appendChild(s);
                console.log('[LO2] Script injected', s.src);
            }

            // Mount: <lightning-out-application> and <c-mads-chat-drawer> as siblings.
            // is-lightning-out   → @api isLightningOut     (skips NavigationMixin)
            // disable-utility-sync → @api disableUtilitySync (skips platformUtilityBarApi)
            var container = document.getElementById('lo-container');
            container.innerHTML = '';

            var loApp = document.createElement('lightning-out-application');
            loApp.setAttribute('frontdoor-url', frontdoorUrl);
            loApp.setAttribute('app-id', appId);
            loApp.setAttribute('components', component);

            var drawer = document.createElement(component);
            drawer.setAttribute('is-lightning-out', 'true');
            drawer.setAttribute('disable-utility-sync', 'true');

            loApp.addEventListener('lo.application.ready', function () {
                console.log('[LO2] ✅ Application ready');
                setStatus('✓ Chat drawer loaded (LO 2.0)', 'ok');
                document.getElementById('lo-load-btn').disabled = false;
            });

            loApp.addEventListener('lo.application.error', function (e) {
                var msg = e.detail ? (e.detail.message || JSON.stringify(e.detail)) : 'unknown';
                console.error('[LO2] ❌ Application error', e.detail);
                setStatus('✗ ' + msg, 'err');
                document.getElementById('lo-load-btn').disabled = false;
            });

            container.appendChild(loApp);
            container.appendChild(drawer);
            setStatus('Mounting…', 'loading');

        } catch (err) {
            console.error('[LO2] Failed', err);
            setStatus('✗ ' + err.message, 'err');
            document.getElementById('lo-load-btn').disabled = false;
        }
    }

    // ══════════════════════════════════════════════════════════════════════════
    // LO 1.0 — Aura, uses $Lightning.use() + $Lightning.createComponent()
    // ══════════════════════════════════════════════════════════════════════════
    function loadLO1() {
        var domain   = document.getElementById('lo-domain').value.trim().replace(/\/$/, '');
        var auraApp  = document.getElementById('lo1-auraapp').value.trim();
        var token    = document.getElementById('lo-token').value.trim();

        if (!domain || !auraApp || !token) {
            setStatus('Fill in all fields', 'err');
            return;
        }

        document.getElementById('lo-load-btn').disabled = true;
        setStatus('Loading Aura runtime…', 'loading');

        var scriptSrc   = domain + '/lightning/lightning.out.js';
        var endpointUrl = domain;

        var container = document.getElementById('lo-container');
        container.innerHTML = '';

        function init() {
            if (!window.$Lightning) {
                setStatus('✗ $Lightning not found after script load', 'err');
                document.getElementById('lo-load-btn').disabled = false;
                return;
            }

            console.log('[LO1] Calling $Lightning.use()', { app: auraApp, endpointUrl: endpointUrl });
            setStatus('Calling $Lightning.use()…', 'loading');

            window.$Lightning.use(
                auraApp,
                function () {
                    console.log('[LO1] ✅ $Lightning.use callback — creating component');
                    setStatus('Creating component…', 'loading');

                    window.$Lightning.createComponent(
                        'c:wrapperMADSLightningOutShell',
                        {},
                        container,
                        function (cmp, status) {
                            console.log('[LO1] createComponent callback', { status: status, cmpExists: !!cmp });
                            if (status === 'SUCCESS') {
                                setStatus('✓ Chat drawer loaded (LO 1.0)', 'ok');
                            } else {
                                setStatus('✗ createComponent status: ' + status, 'err');
                            }
                            document.getElementById('lo-load-btn').disabled = false;
                        }
                    );
                },
                endpointUrl,
                token,
                function () {
                    console.log('[LO1] readyCallback fired');
                }
            );
        }

        if (_lo1ScriptInjected) {
            init();
        } else {
            _lo1ScriptInjected = true;
            var s = document.createElement('script');
            s.src = scriptSrc;
            s.async = true;
            s.addEventListener('load', init);
            s.addEventListener('error', function () {
                setStatus('✗ Failed to load lightning.out.js', 'err');
                document.getElementById('lo-load-btn').disabled = false;
            });
            document.head.appendChild(s);
            console.log('[LO1] Script injected', scriptSrc);
        }
    }
</script>

</body>
</html>
